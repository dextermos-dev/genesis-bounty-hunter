name: Security Automation

on:
  schedule:
    # Ejecuta el ciclo recurrente horario de forma autónoma
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-autonomous-hunter:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Unit Tests & Autonomous Bounty Hunter
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          WEB3_WALLET_ADDRESS: ${{ secrets.WEB3_WALLET_ADDRESS || '0x8366bCe3a2D379Dec7656D7A67015789FaF999f20' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python main.py
