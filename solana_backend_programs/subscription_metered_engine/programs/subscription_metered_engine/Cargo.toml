[package]
name = "subscription-metered-engine"
version = "0.1.0"
description = "Production On-Chain Subscription & Metered Usage Backend on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "subscription_metered_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18"
thiserror = "1.0"
